<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Customers - Cheque Pool Health Care</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f9;
  color:#222;
}

  background:#087f5b;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  margin:0;
  font-size:20px;
}

.back{
  background:white;
  color:#087f5b;
  border:0;
  padding:9px 14px;

}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

  margin-bottom:5px;
}

.subtitle{
  color:#666;
  margin-top:0;
}

.card{
  margin-top:25px;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}

.card h2{
  margin-top:0;

  width:100%;

}

}

  table{

</style></head><body><header class="header">  <h2>👥 CHEQUE POOL HEALTH CARE</h2>  <button class="back" onclick="location.href='admin.html'">
    ← Admin
  </button></header><main class="container">  <h1>👥 Customers</h1>  <p class="subtitle">
    Manage your medical shop customers.
  </p>  <!-- ADD CUSTOMER -->  <section class="card"><h2>➕ Add Customer</h2>

<input
  id="customerName"
  type="text"
  placeholder="Customer name"
>

<br><br>

<input
  id="customerPhone"
  type="tel"
  inputmode="numeric"
  maxlength="10"
  placeholder="10 digit phone number"
>

<br><br>

<button
  id="addCustomerBtn"
  class="add-btn"
  onclick="addCustomer()"
>
  ➕ Add Customer
</button>

<div id="addStatus" class="status"></div>

  </section>  <!-- CUSTOMER LIST -->  <section class="card"><h2>🔍 Customer List</h2>

<input
  id="search"
  type="text"
  placeholder="Search customer by name or phone..."
  oninput="displayCustomers()"
>

<div style="overflow-x:auto;">

  <table>

    <thead>
      <tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Total Orders</th>
      </tr>
    </thead>

    <tbody id="customerList"></tbody>

  </table>

</div>

  </section></main><script>

const SUPABASE_URL =
  "https://ymhaxeferrpyhuavzcgu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oW6iGlVz8JhV6tpwm_SrKQ_sDlHBedX";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let customers = [];


/* =========================
   LOAD CUSTOMERS
========================= */

async function loadCustomers(){

  const list =
    document.getElementById("customerList");

  list.innerHTML =
    '<tr><td colspan="3" class="empty">Loading customers...</td></tr>';

  // Customers load
  const { data: customerData, error: customerError } =
    await supabaseClient
      .from("users")
      .select("id, name, phone")
      .order("name", { ascending:true });

  if(customerError){

    console.error(customerError);

    list.innerHTML =
      '<tr><td colspan="3" class="empty">' +
      'Customers load nahi ho paaye.' +
      '</td></tr>';

    alert(
      "Customers load nahi ho paaye.\n\n" +
      customerError.message
    );

    return;
  }

  // Orders load
  const { data: orderData, error: orderError } =
    await supabaseClient
      .from("orders")
      .select("user_id");

  if(orderError){

    console.error(orderError);

    alert(
      "Orders count load nahi ho paaya.\n\n" +
      orderError.message
    );

    return;
  }

  // Har customer ke orders count karna
  const orderCounts = {};

  (orderData || []).forEach(function(order){

    if(order.user_id){

      orderCounts[order.user_id] =
        (orderCounts[order.user_id] || 0) + 1;

    }

  });

  // Customer ke saath totalOrders attach karna
  customers =
    (customerData || []).map(function(customer){

      return {
        ...customer,
        totalOrders:
          orderCounts[customer.id] || 0
      };

    });

  displayCustomers();
}

/* =========================
   DISPLAY CUSTOMERS
========================= */

function displayCustomers(){

  const list =
    document.getElementById("customerList");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    customers.filter(function(customer){

      const name =
        String(customer.name || "")
          .toLowerCase();

      const phone =
        String(customer.phone || "")
          .toLowerCase();

      return (
        name.includes(search) ||
        phone.includes(search)
      );

    });


  list.innerHTML = "";


  if(filtered.length === 0){

    list.innerHTML =
      '<tr>' +
      '<td colspan="2" class="empty">' +
      'No customers found.' +
      '</td>' +
      '</tr>';

    return;
  }


  filtered.forEach(function(customer){

    const row =
      document.createElement("tr");


    row.innerHTML = `

  <td>
    ${escapeHtml(customer.name || "")}
  </td>

  <td>
    ${escapeHtml(customer.phone || "")}
  </td>

  <td>
    ${customer.totalOrders || 0}
  </td>

`;


    list.appendChild(row);

  });

}


/* =========================
   ADD CUSTOMER
========================= */

async function addCustomer(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const status =
    document.getElementById("addStatus");


  const button =
    document.getElementById("addCustomerBtn");


  status.innerText = "";


  /* NAME CHECK */

  if(!name){

    alert("Please enter customer name.");

    return;
  }


  /* PHONE CHECK */

  if(phone && !/^[0-9]{10}$/.test(phone)){

    alert(
      "Please enter a valid 10 digit phone number."
    );

    return;
  }


  /* DUPLICATE PHONE CHECK */

  if(phone){

    const { data: existingCustomer, error: checkError } =
      await supabaseClient
        .from("users")
        .select("id, name, phone")
        .eq("phone", phone)
        .limit(1);


    if(checkError){

      console.error(checkError);

      alert(
        "Customer check failed.\n\n" +
        checkError.message
      );

      return;
    }


    if(existingCustomer && existingCustomer.length > 0){

      alert(
        "This phone number is already registered.\n\n" +
        "Customer: " +
        (existingCustomer[0].name || "Unknown")
      );

      return;
    }

  }


  /* DISABLE BUTTON */

  button.disabled = true;
  button.innerText = "Adding...";


  /* INSERT */

  const { data, error } =
    await supabaseClient
      .from("users")
      .insert([
        {
          name: name,
          phone: phone || null
        }
      ])
      .select()
      .single();


  if(error){

    console.error(error);

    button.disabled = false;
    button.innerText = "➕ Add Customer";


    alert(
      "Customer add nahi ho paaya.\n\n" +
      error.message
    );

    return;
  }


  /* SUCCESS */

  status.innerText =
    "✅ Customer added successfully.";


  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";


  button.disabled = false;
  button.innerText = "➕ Add Customer";


  /* RELOAD LIST */

  await loadCustomers();


  /* CLEAR MESSAGE */

  setTimeout(function(){

    status.innerText = "";

  },3000);

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadCustomers();

</script></body>
</html>
