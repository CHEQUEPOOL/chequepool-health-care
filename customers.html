  async function viewOrderDetails(orderId){

  const { data: order, error } =
    await supabaseClient
      .from("orders")
      .select(`
        id,
        user_id,
        address_id,
        prescription_id,
        total,
        total_amount,
        status,
        order_status,
        payment_status,
        created_at
      `)
      .eq("id", orderId)
      .single();

  if(error){

    console.error(error);

    alert(
      "Order details load nahi ho paaye.\n\n" +
      error.message
    );

    return;
  }

  let addressText =
    "Address information not available.";

  if(order.address_id){

    const { data: address, error: addressError } =
      await supabaseClient
        .from("addresses")
        .select(
          "recipient_name, phone, address, city, pincode"
        )
        .eq("id", order.address_id)
        .maybeSingle();

    if(!addressError && address){

      addressText = `
        <strong>${escapeHtml(address.recipient_name || "")}</strong><br>
        ${escapeHtml(address.phone || "")}<br>
        ${escapeHtml(address.address || "")}<br>
        ${escapeHtml(address.city || "")}
        - ${escapeHtml(address.pincode || "")}
      `;
    }
  }

  const date =
    new Date(order.created_at)
      .toLocaleString("en-IN");

  const status =
    order.status ||
    order.order_status ||
    "PENDING";

  const payment =
    order.payment_status ||
    "PENDING";

  const oldDetails =
    document.getElementById("orderDetailsBox");

  if(oldDetails){
    oldDetails.remove();
  }

  const detailsBox =
    document.createElement("div");

  detailsBox.id = "orderDetailsBox";

  detailsBox.style.position = "fixed";
  detailsBox.style.top = "0";
  detailsBox.style.left = "0";
  detailsBox.style.width = "100%";
  detailsBox.style.height = "100%";
  detailsBox.style.background = "rgba(0,0,0,0.6)";
  detailsBox.style.zIndex = "10000";
  detailsBox.style.padding = "20px";
  detailsBox.style.overflowY = "auto";

  detailsBox.innerHTML = `

    <div style="
      max-width:600px;
      margin:40px auto;
      background:white;
      border-radius:12px;
      padding:22px;
      box-shadow:0 5px 25px rgba(0,0,0,0.3);
    ">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;

        <p>

}


/* =========================
   VIEW PRESCRIPTION
========================= */

async function viewPrescription(prescriptionId){

  const { data: prescription, error } =
    await supabaseClient
      .from("prescriptions")
      .select("id, private_file_key, status")
      .eq("id", prescriptionId)
      .single();

  if(error){

    console.error(error);

    alert(
      "Prescription load nahi ho paayi.\n\n" +
      error.message
    );

    return;
  }

  if(
    !prescription ||
    !prescription.private_file_key
  ){

    alert("Prescription file nahi mili.");

    return;
  }

  const { data: signedData, error: signedError } =
    await supabaseClient
      .storage
      .from("prescriptions")
      .createSignedUrl(
        prescription.private_file_key,
        300
      );

  if(signedError){

    console.error(signedError);

    alert(
      "Prescription open nahi ho paayi.\n\n" +
      signedError.message
    );

    return;
  }

  if(
    !signedData ||
    !signedData.signedUrl
  ){

    alert(
      "Prescription URL generate nahi ho paaya."
    );

    return;
  }

  window.open(
    signedData.signedUrl,
    "_blank"
  );
}


/* =========================
   LOAD CUSTOMERS
========================= */


async function loadCustomers(){

  const list =
    document.getElementById("customerList");

  list.innerHTML =
    '<tr><td colspan="3" class="empty">Loading customers...</td></tr>';

  // Customers load
  const { data: customerData, error: customerError } =
    await supabaseClient
      .from("users")
      .select("id, name, phone")
      .order("name", { ascending:true });

  if(customerError){

    console.error(customerError);

    list.innerHTML =
      '<tr><td colspan="3" class="empty">' +
      'Customers load nahi ho paaye.' +
      '</td></tr>';

    alert(
      "Customers load nahi ho paaye.\n\n" +
      customerError.message
    );

    return;
  }

  // Orders load
  const { data: orderData, error: orderError } =
    await supabaseClient
      .from("orders")
      .select("user_id");

  if(orderError){

    console.error(orderError);

    alert(
      "Orders count load nahi ho paaya.\n\n" +
      orderError.message
    );

    return;
  }

  // Har customer ke orders count karna
  const orderCounts = {};

  (orderData || []).forEach(function(order){

    if(order.user_id){

      orderCounts[order.user_id] =
        (orderCounts[order.user_id] || 0) + 1;

    }

  });

  // Customer ke saath totalOrders attach karna
  customers =
    (customerData || []).map(function(customer){

      return {
        ...customer,
        totalOrders:
          orderCounts[customer.id] || 0
      };

    });

  displayCustomers();
}

/* =========================
   DISPLAY CUSTOMERS
========================= */

function displayCustomers(){

  const list =
    document.getElementById("customerList");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    customers.filter(function(customer){

      const name =
        String(customer.name || "")
          .toLowerCase();

      const phone =
        String(customer.phone || "")
          .toLowerCase();

      return (
        name.includes(search) ||
        phone.includes(search)
      );

    });


  list.innerHTML = "";


  if(filtered.length === 0){

    list.innerHTML =
      '<tr>' +
      '<td colspan="2" class="empty">' +
      'No customers found.' +
      '</td>' +
      '</tr>';

    return;
  }


  filtered.forEach(function(customer){

    const row =
      document.createElement("tr");


    row.innerHTML = `

  <td>
    ${escapeHtml(customer.name || "")}
  </td>

  <td>
    ${escapeHtml(customer.phone || "")}
  </td>

  <td>
    ${customer.totalOrders || 0}
  </td>
  
<td>
  <button
    onclick="viewCustomerOrders('${customer.id}')">
    View Orders
  </button>
</td>
`;


    list.appendChild(row);

  });

}


/* =========================
   ADD CUSTOMER
========================= */

async function addCustomer(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const status =
    document.getElementById("addStatus");


  const button =
    document.getElementById("addCustomerBtn");


  status.innerText = "";


  /* NAME CHECK */

  if(!name){

    alert("Please enter customer name.");

    return;
  }


  /* PHONE CHECK */

  if(phone && !/^[0-9]{10}$/.test(phone)){

    alert(
      "Please enter a valid 10 digit phone number."
    );

    return;
  }


  /* DUPLICATE PHONE CHECK */

  if(phone){

    const { data: existingCustomer, error: checkError } =
      await supabaseClient
        .from("users")
        .select("id, name, phone")
        .eq("phone", phone)
        .limit(1);


    if(checkError){

      console.error(checkError);

      alert(
        "Customer check failed.\n\n" +
        checkError.message
      );

      return;
    }


    if(existingCustomer && existingCustomer.length > 0){

      alert(
        "This phone number is already registered.\n\n" +
        "Customer: " +
        (existingCustomer[0].name || "Unknown")
      );

      return;
    }

  }


  /* DISABLE BUTTON */

  button.disabled = true;
  button.innerText = "Adding...";


  /* INSERT */

  const { data, error } =
    await supabaseClient
      .from("users")
      .insert([
        {
          name: name,
          phone: phone || null
        }
      ])
      .select()
      .single();


  if(error){

    console.error(error);

    button.disabled = false;
    button.innerText = "➕ Add Customer";


    alert(
      "Customer add nahi ho paaya.\n\n" +
      error.message
    );

    return;
  }


  /* SUCCESS */

  status.innerText =
    "✅ Customer added successfully.";


  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";


  button.disabled = false;
  button.innerText = "➕ Add Customer";


  /* RELOAD LIST */

  await loadCustomers();


  /* CLEAR MESSAGE */

  setTimeout(function(){

    status.innerText = "";

  },3000);

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadCustomers();
