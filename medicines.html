<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medicines - Cheque Pool Health Care</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f9;
  color:#222;
}

.header{
  background:#087f5b;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  margin:0;
  font-size:20px;
}

.back{
  background:white;
  color:#087f5b;
  border:0;
  padding:9px 14px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

h1{
  margin-bottom:5px;
}

.subtitle{
  color:#666;
  margin-top:0;
}

.form{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
  margin-top:20px;
}

.form h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

label{
  font-weight:bold;
  display:block;
  margin-bottom:6px;
}

.full{
  grid-column:1/-1;
}

.add{
  margin-top:15px;
  background:#087f5b;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
}

.search{
  margin-top:25px;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#087f5b;
  color:white;
}

.delete{
  background:#d32f2f;
  color:white;
  border:0;
  padding:7px 10px;
  border-radius:6px;
}
  
.edit{
  background:#087f5b;
  color:white;
  border:0;
  padding:7px 10px;
  border-radius:6px;
  margin-right:5px;
  }
.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  table{
    font-size:13px;
  }

  th,td{
    padding:8px;
  }

  .header h2{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h2>💊 CHEQUE POOL HEALTH CARE</h2>

  <button class="back" onclick="location.href='admin.html'">
    ← Admin
  </button>
</header>

<main class="container">

  <h1>💊 Medicines</h1>
  <p class="subtitle">Manage your medical shop medicines.</p>

  <section class="form">

    <h2>Add Medicine</h2>

    <div class="grid">

      <div>
        <label>Medicine Name</label>
        <input id="name" type="text" placeholder="e.g. Paracetamol">
      </div>

      <div>
        <label>Brand / Company</label>
        <input id="brand" type="text" placeholder="e.g. Cipla">
      </div>

      <div>
        <label>Strength</label>
        <input id="strength" type="text" placeholder="e.g. 500mg">
      </div>

      <div>
        <label>Category</label>
        <select id="category">
          <option value="">Select category</option>
          <option>Tablet</option>
          <option>Capsule</option>
          <option>Syrup</option>
          <option>Injection</option>
          <option>Cream</option>
          <option>Drops</option>
          <option>Other</option>
        </select>
      </div>

      <div>
        <label>MRP (₹)</label>
        <input id="mrp" type="number" min="0" step="0.01" placeholder="0">
      </div>

      <div>
        <label>Sale Price (₹)</label>
        <input id="sale_price" type="number" min="0" step="0.01" placeholder="0">
      </div>

      <div>
        <label>Stock</label>
        <input id="stock" type="number" min="0" placeholder="0">
      </div>

      <div>
        <label>Expiry Date</label>
        <input id="expiry_date" type="date">
      </div>

      <div>
        <label>Prescription Required</label>
        <select id="require_prescription">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>

      <div>
        <label>Active</label>
        <select id="active">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

    </div>

    <button id="medicineButton" class="add" onclick="addMedicine()">
  ➕ Add Medicine
    </button>

  </section>

  <section class="search">

    <h2>🔍 Medicine List</h2>

    <input
      id="search"
      type="text"
      placeholder="Search medicine..."
      oninput="displayMedicines()"
    >

    <div style="overflow-x:auto;">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Brand</th>
            <th>Strength</th>
            <th>Category</th>
            <th>MRP</th>
            <th>Sale Price</th>
            <th>Stock</th>
            <th>Expiry</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="medicineList"></tbody>

      </table>

    </div>

  </section>

</main>

<script>

const SUPABASE_URL =
  "https://ymhaxeferrpyhuavzcgu.supabase.co";

/*
  यहाँ अपना वही Supabase Publishable Key डालें
  जो हमने पहले इस्तेमाल किया था.
*/
const SUPABASE_KEY =
  "sb_publishable_oW6iGlVz8JhV6tpwm_SrKQ_sDlHBedX";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let medicines = [];
let editingId = null;

/* LOAD MEDICINES */

async function loadMedicines(){

  const { data, error } =
    await supabaseClient
      .from("medicines")
      .select("*")
      .order("name", { ascending:true });

  if(error){

    console.error(error);

    alert(
      "Medicines load nahi ho paayi.\n\n" +
      error.message
    );

    return;
  }

  medicines = data || [];

  displayMedicines();
}


/* ADD MEDICINE */

async function addMedicine(){

  if(editingId !== null){
    await updateMedicine();
    return;
  }

  const name =
    document.getElementById("name").value.trim();

  const brand =
    document.getElementById("brand").value.trim();

  const strength =
    document.getElementById("strength").value.trim();

  const category =
    document.getElementById("category").value;

  const mrp =
    document.getElementById("mrp").value;

  const sale_price =
    document.getElementById("sale_price").value;

  const stock =
    document.getElementById("stock").value;

  const expiry_date =
    document.getElementById("expiry_date").value;

  const require_prescription =
    document.getElementById("require_prescription").value === "true";

  const active =
    document.getElementById("active").value === "true";


  if(!name){

    alert("Please enter medicine name.");
    return;
  }

  if(mrp === ""){

    alert("Please enter MRP.");
    return;
  }

  if(sale_price === ""){

    alert("Please enter sale price.");
    return;
  }

  if(stock === ""){

    alert("Please enter stock.");
    return;
  }


  const medicine = {

    id: crypto.randomUUID(),

    name: name,

    brand: brand,

    strength: strength,

    category: category,

    mrp: Number(mrp),

    sale_price: Number(sale_price),

    stock: Number(stock),

    require_prescription:
      require_prescription,

    expiry_date:
      expiry_date || null,

    active:
      active
  };


  const { error } =
    await supabaseClient
      .from("medicines")
      .insert([medicine]);


  if(error){

    console.error(error);

    alert(
      "Medicine add nahi hui.\n\n" +
      error.message
    );

    return;
  }


  alert("Medicine added successfully.");

  clearForm();

  loadMedicines();
}


/* CLEAR FORM */

function clearForm(){

  document.getElementById("name").value = "";

  document.getElementById("brand").value = "";

  document.getElementById("strength").value = "";

  document.getElementById("category").value = "";

  document.getElementById("mrp").value = "";

  document.getElementById("sale_price").value = "";

  document.getElementById("stock").value = "";

  document.getElementById("expiry_date").value = "";

  document.getElementById("require_prescription").value =
    "false";

  document.getElementById("active").value =
    "true";
}


/* DELETE MEDICINE */

async function deleteMedicine(id){

  if(!confirm("Delete this medicine?")){

    return;
  }


  const { error } =
    await supabaseClient
      .from("medicines")
      .delete()
      .eq("id", id);


  if(error){

    console.error(error);

    alert(
      "Medicine delete nahi hui.\n\n" +
      error.message
    );

    return;
  }


  loadMedicines();
}
/* EDIT MEDICINE */

function editMedicine(id){

  const medicine =
    medicines.find(function(item){
      return item.id === id;
    });

  if(!medicine){
    alert("Medicine not found.");
    return;
  }

  editingId = id;

  document.getElementById("name").value =
    medicine.name || "";

  document.getElementById("brand").value =
    medicine.brand || "";

  document.getElementById("strength").value =
    medicine.strength || "";

  document.getElementById("category").value =
    medicine.category || "";

  document.getElementById("mrp").value =
    medicine.mrp ?? "";

  document.getElementById("sale_price").value =
    medicine.sale_price ?? "";

  document.getElementById("stock").value =
    medicine.stock ?? "";

  document.getElementById("expiry_date").value =
    medicine.expiry_date || "";

  document.getElementById("require_prescription").value =
    medicine.require_prescription ? "true" : "false";

  document.getElementById("active").value =
    medicine.active ? "true" : "false";


  document.getElementById("medicineButton").innerHTML =
    "✏️ Update Medicine";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* UPDATE MEDICINE */

async function updateMedicine(){

  const name =
    document.getElementById("name").value.trim();

  const brand =
    document.getElementById("brand").value.trim();

  const strength =
    document.getElementById("strength").value.trim();

  const category =
    document.getElementById("category").value;

  const mrp =
    document.getElementById("mrp").value;

  const sale_price =
    document.getElementById("sale_price").value;

  const stock =
    document.getElementById("stock").value;

  const expiry_date =
    document.getElementById("expiry_date").value;

  const require_prescription =
    document.getElementById("require_prescription").value === "true";

  const active =
    document.getElementById("active").value === "true";


  if(!name){

    alert("Please enter medicine name.");
    return;
  }

  if(mrp === ""){

    alert("Please enter MRP.");
    return;
  }

  if(sale_price === ""){

    alert("Please enter sale price.");
    return;
  }

  if(stock === ""){

    alert("Please enter stock.");
    return;
  }


  const { error } =
    await supabaseClient
      .from("medicines")
      .update({

        name:name,

        brand:brand,

        strength:strength,

        category:category,

        mrp:Number(mrp),

        sale_price:Number(sale_price),

        stock:Number(stock),

        require_prescription:
          require_prescription,

        expiry_date:
          expiry_date || null,

        active:
          active

      })
      .eq("id", editingId);


  if(error){

    console.error(error);

    alert(
      "Medicine update nahi hui.\n\n" +
      error.message
    );

    return;
  }


  alert("Medicine updated successfully.");

  editingId = null;

  clearForm();

  document.getElementById("medicineButton").innerHTML =
    "➕ Add Medicine";

  loadMedicines();
  }

/* DISPLAY MEDICINES */

function displayMedicines(){

  const list =
    document.getElementById("medicineList");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    medicines.filter(function(medicine){

      return (

        (medicine.name || "")
          .toLowerCase()
          .includes(search)

        ||

        (medicine.brand || "")
          .toLowerCase()
          .includes(search)

        ||

        (medicine.strength || "")
          .toLowerCase()
          .includes(search)

        ||

        (medicine.category || "")
          .toLowerCase()
          .includes(search)

      );

    });


  list.innerHTML = "";


  if(filtered.length === 0){

    list.innerHTML =
      '<tr>' +
      '<td colspan="9" class="empty">' +
      'No medicines found.' +
      '</td>' +
      '</tr>';

    return;
  }


  filtered.forEach(function(medicine){

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>${escapeHtml(medicine.name || "")}</td>

      <td>${escapeHtml(medicine.brand || "")}</td>

      <td>${escapeHtml(medicine.strength || "")}</td>

      <td>${escapeHtml(medicine.category || "")}</td>

      <td>₹${medicine.mrp ?? 0}</td>

      <td>₹${medicine.sale_price ?? 0}</td>

      <td>${medicine.stock ?? 0}</td>

      <td>${medicine.expiry_date || "-"}</td>

    <td>

  <button
    class="edit"
    onclick="editMedicine('${medicine.id}')">

    Edit

  </button>

  <button
    class="delete"
    onclick="deleteMedicine('${medicine.id}')">

    Delete

  </button>

</td>

    `;


    list.appendChild(row);

  });

}


/* SECURITY */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");
}


/* START */

loadMedicines();

</script>

</body>
</html>
