<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Admin Panel - Cheque Pool Health Care</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f9;
    color:#222;
}

.header{
    background:#087f5b;
    color:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    margin:0;
    font-size:20px;
}

.logout{
    background:white;
    color:#087f5b;
    border:0;
    padding:9px 14px;
    border-radius:8px;
    font-weight:bold;
}

.container{
    padding:18px;
    max-width:1100px;
    margin:auto;
}

.welcome{
    margin-bottom:20px;
}

.welcome h1{
    margin-bottom:5px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px #0001;
}

.card h3{
    margin:0;
    color:#666;
    font-size:14px;
}

.number{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
    color:#087f5b;
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:25px;
}

.menu button{
    border:0;
    background:white;
    padding:22px 10px;
    border-radius:12px;
    box-shadow:0 2px 8px #0001;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.menu button:hover{
    background:#e9f8f3;
}

.section{
    background:white;
    margin-top:25px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px #0001;
}

.section h2{
    margin-top:0;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

.status{
    background:#fff3cd;
    padding:5px 9px;
    border-radius:6px;
    font-size:12px;
}

@media(max-width:700px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .menu{
        grid-template-columns:repeat(2,1fr);
    }

    .header h2{
        font-size:16px;
    }

    table{
        font-size:13px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h2>CHEQUE POOL HEALTH CARE</h2>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<main class="container">

    <div class="welcome">
        <h1>Admin Dashboard</h1>
        <p>Manage your medical shop from here.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Orders</h3>
            <div class="number" id="orders">0</div>
        </div>

        <div class="card">
            <h3>Total Medicines</h3>
            <div class="number" id="medicines">0</div>
        </div>

        <div class="card">
            <h3>Customers</h3>
            <div class="number" id="customers">0</div>
        </div>

        <div class="card">
            <h3>Prescriptions</h3>
            <div class="number" id="prescriptions">0</div>
        </div>

    </div>

    <div class="menu">

        <button onclick="loadOrders()">
    📦<br>Orders
        </button>

        <button onclick="location.href='medicines.html'">
    💊<br>Medicines
        </button>

        <button onclick="location.href='customers.html'">
    👥<br>Customers
        </button>

        <button onclick="location.href='prescriptions.html'">
   📄<br>Prescriptions
        </button>

        <button onclick="showMessage('Delivery')">
            🚚<br>Delivery
        </button>

        <button onclick="showMessage('Settings')">
            ⚙️<br>Settings
        </button>

    </div>

    <div class="section">

        <h2>Recent Orders</h2>

<table>
    <thead>
        <tr>
            <th>Customer</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Total</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>

            <tbody id="ordersTableBody">
            </tbody>
        </table>

    </div>

</main>

<script>
    const SUPABASE_URL =
  "https://ymhaxeferrpyhuavzcgu.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_oW6iGlVz8JhV6tpwm_SrKQ_sDlHBedX";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

    async function loadDashboard(){

    const { count: medicineCount, error: medicineError } =
        await supabaseClient
        .from("medicines")
        .select("*", { count: "exact", head: true });

    if(medicineError){
        console.error("Medicines count error:", medicineError);
    } else {
        document.getElementById("medicines").textContent =
            medicineCount || 0;
    }


    const { count: orderCount, error: orderError } =
        await supabaseClient
        .from("orders")
        .select("*", { count: "exact", head: true });

    if(orderError){
        console.error("Orders count error:", orderError);
    } else {
        document.getElementById("orders").textContent =
            orderCount || 0;
    }


    const { count: customerCount, error: customerError } =
        await supabaseClient
        .from("users")
        .select("*", { count: "exact", head: true });

    if(customerError){
        console.error("Customers count error:", customerError);
    } else {
        document.getElementById("customers").textContent =
            customerCount || 0;
    }


    const { count: prescriptionCount, error: prescriptionError } =
        await supabaseClient
        .from("prescriptions")
        .select("*", { count: "exact", head: true });

    if(prescriptionError){
        console.error("Prescriptions count error:", prescriptionError);
    } else {
        document.getElementById("prescriptions").textContent =
            prescriptionCount || 0;
    }

}

loadDashboard();
function showMessage(name){
    alert(name + " section will be connected next.");
}

function logout(){
    alert("Admin logout will be connected with secure login.");
}

    async function loadOrders(){

  const { data: orders, error: ordersError } =
    await supabaseClient
      .from("orders")
      .select(`
        id,
        user_id,
        address_id,
        total,
        total_amount,
        status,
        order_status,
        payment_status,
        created_at
      `)
      .order("created_at", { ascending: false })
      .limit(10);


  if(ordersError){

    console.error(ordersError);

    alert(
      "Orders load nahi ho paaye.\n\n" +
      ordersError.message
    );

    return;
  }


  const tbody =
    document.getElementById("ordersTableBody");


  if(!tbody){

    alert("ordersTableBody nahi mila.");

    return;
  }


  tbody.innerHTML = "";


  if(!orders || orders.length === 0){

    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="text-align:center;">
          No orders found
        </td>
      </tr>
    `;

    return;
  }


  for(const order of orders){

    let customerName = "Customer";
    let phone = "-";
    let fullAddress = "-";


    /* CUSTOMER */

    if(order.user_id){

      const { data: user, error: userError } =
        await supabaseClient
          .from("users")
          .select("name, phone")
          .eq("id", order.user_id)
          .maybeSingle();


      if(userError){

        console.error(
          "Customer load error:",
          userError
        );

      }


      if(user){

        customerName =
          user.name || "Customer";

        phone =
          user.phone || "-";

      }

    }


    /* ADDRESS */

    if(order.address_id){

      const { data: address, error: addressError } =
        await supabaseClient
          .from("addresses")
          .select(
            "recipient_name, phone, address, city, pincode"
          )
          .eq("id", order.address_id)
          .maybeSingle();


      if(addressError){

        console.error(
          "Address load error:",
          addressError
        );

      }


      if(address){

        if(customerName === "Customer"){

          customerName =
            address.recipient_name ||
            "Customer";

        }


        if(phone === "-"){

          phone =
            address.phone || "-";

        }


        fullAddress = `
          ${address.address || ""}
          ${address.city || ""}
          ${address.pincode || ""}
        `.trim();


        if(!fullAddress){

          fullAddress = "-";

        }

      }

    }


    /* STATUS */

    const status =
      order.status ||
      order.order_status ||
      "PENDING";


    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>
        ${customerName}
      </td>

      <td>
        ${phone}
      </td>

      <td>
        ${fullAddress}
      </td>

      <td>
        ₹${Number(order.total || 0)}
      </td>

      <td>
        <span class="status">
          ${status}
        </span>
      </td>

<td>

  <button
    type="button"
    class="detailsBtn"
    data-order-id="${order.id}"
    style="
      background:#087f5b;
      color:white;
      border:0;
      padding:7px 12px;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
    "
  >
    🔎 Details
  </button>

</td>

    `;


    tbody.appendChild(row);
const detailsBtn =
  row.querySelector(".detailsBtn");

detailsBtn.addEventListener("click", function(){

  const orderId =
    this.getAttribute("data-order-id");

  viewOrderDetails(orderId);

});

  } // for loop close

} // loadOrders function close


async function viewOrderDetails(orderId){

  const { data: order, error: orderError } =
    await supabaseClient
      .from("orders")
      .select(`
        id,
        user_id,
        address_id,
        prescription_id,
        total,
        total_amount,
        status,
        order_status,
        payment_status,
        created_at
      `)
      .eq("id", orderId)
      .single();

  if(orderError){

    console.error(orderError);

    alert(
      "Order details load nahi ho paaye.\n\n" +
      orderError.message
    );

    return;
  }


  /* CUSTOMER */

  let customerName = "Customer";
  let customerPhone = "-";

  if(order.user_id){

    const { data: user } =
      await supabaseClient
        .from("users")
        .select("name, phone")
        .eq("id", order.user_id)
        .maybeSingle();

    if(user){

      customerName =
        user.name || "Customer";

      customerPhone =
        user.phone || "-";

    }

  }


  /* ADDRESS */

  let deliveryAddress = "-";

  if(order.address_id){

    const { data: address } =
      await supabaseClient
        .from("addresses")
        .select(
          "recipient_name, phone, address, city, pincode"
        )
        .eq("id", order.address_id)
        .maybeSingle();

    if(address){

      deliveryAddress = `
        ${address.address || ""}
        ${address.city || ""}
        ${address.pincode || ""}
      `.trim();

    }

  }


  /* ORDER ITEMS */

  const { data: items, error: itemsError } =
    await supabaseClient
      .from("order_items")
      .select(
        "id, medicine_id, quantity, unit_price"
      )
      .eq("order_id", orderId);

  if(itemsError){

    console.error(itemsError);

    alert(
      "Order medicines load nahi ho paayi.\n\n" +
      itemsError.message
    );

    return;
  }


  let medicineRows = "";


  if(items && items.length > 0){

    for(const item of items){

      let medicineName = "Medicine";

const { data: medicine } =
  await supabaseClient
    .from("medicines")
    .select("name, strength")
    .eq("id", item.medicine_id)
    .maybeSingle();

if(medicine){

  medicineName =
    "💊 " + (medicine.name || "Medicine");

  if(medicine.strength){

    medicineName +=
      " (" + medicine.strength + ")";

  }

}


      const itemTotal =
        Number(item.quantity || 0) *
        Number(item.unit_price || 0);


      medicineRows += `
        <tr>

          <td style="border:1px solid #ddd;padding:8px;">
            ${medicineName}
          </td>

          <td style="border:1px solid #ddd;padding:8px;">
            ${item.quantity}
          </td>

          <td style="border:1px solid #ddd;padding:8px;">
            ₹${Number(item.unit_price || 0)}
          </td>

          <td style="border:1px solid #ddd;padding:8px;">
            ₹${itemTotal}
          </td>

        </tr>
      `;

    }

  }else{

    medicineRows = `
      <tr>

        <td
          colspan="4"
          style="border:1px solid #ddd;padding:8px;text-align:center;"
        >
          No medicines found
        </td>

      </tr>
    `;

  }


  /* PRESCRIPTION */

  let prescriptionButton = "";

  if(order.prescription_id){

    prescriptionButton = `
      <button
        onclick="viewPrescription('${order.prescription_id}')"
        style="
          background:#1976d2;
          color:white;
          border:0;
          padding:10px 15px;
          border-radius:6px;
          cursor:pointer;
          margin-bottom:10px;
        "
      >
        📄 View Prescription
      </button>
    `;

  }else{

    prescriptionButton = `
      <p>
        <b>Prescription:</b> Not attached
      </p>
    `;

  }


  /* DETAILS BOX */

  const oldBox =
    document.getElementById("orderDetailsBox");

  if(oldBox){
    oldBox.remove();
  }


  const detailsBox =
    document.createElement("div");

  detailsBox.id =
    "orderDetailsBox";


  detailsBox.style = `
    position:fixed;
    top:5%;
    left:5%;
    width:90%;
    max-height:90vh;
    overflow:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
    z-index:9999;
  `;


  detailsBox.innerHTML = `

    <h2>📦 Order Details</h2>

    <p>
      <b>Order ID:</b>
      ${order.id}
    </p>

    <p>
      <b>Date:</b>
      ${new Date(order.created_at).toLocaleString()}
    </p>

    <hr>


    <h3>Customer</h3>

    <p>
      <b>Name:</b>
      ${customerName}
    </p>

    <p>
      <b>Phone:</b>
      ${customerPhone}
    </p>


    <h3>Delivery Address</h3>

    <p>
      ${deliveryAddress}
    </p>


    <h3>Medicines</h3>

    <table
      style="
        width:100%;
        border-collapse:collapse;
      "
    >

      <thead>

        <tr>

          <th style="border:1px solid #ddd;padding:8px;">
            Medicine
          </th>

          <th style="border:1px solid #ddd;padding:8px;">
            Qty
          </th>

          <th style="border:1px solid #ddd;padding:8px;">
            Price
          </th>

          <th style="border:1px solid #ddd;padding:8px;">
            Total
          </th>

        </tr>

      </thead>

      <tbody>

        ${medicineRows}

      </tbody>

    </table>


    <h3>
      Total:
      ₹${Number(order.total || 0)}
    </h3>


    <p>
      <b>Order Status:</b>
      ${order.status || order.order_status || "PENDING"}
    </p>


    <p>
      <b>Payment Status:</b>
      ${order.payment_status || "PENDING"}
    </p>


    <hr>


    <h3>📄 Prescription</h3>

    ${prescriptionButton}


    <h3>⚙️ Order Controls</h3>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">

      <button
        onclick="updateOrderStatus('${order.id}','APPROVED')"
        style="
          background:#2e7d32;
          color:white;
          border:0;
          padding:10px 15px;
          border-radius:6px;
          cursor:pointer;
        "
      >
        ✅ Approve
      </button>


      <button
        onclick="updateOrderStatus('${order.id}','REJECTED')"
        style="
          background:#c62828;
          color:white;
          border:0;
          padding:10px 15px;
          border-radius:6px;
          cursor:pointer;
        "
      >
        ❌ Reject
      </button>


      <button
        onclick="updateOrderStatus('${order.id}','PENDING')"
        style="
          background:#f57c00;
          color:white;
          border:0;
          padding:10px 15px;
          border-radius:6px;
          cursor:pointer;
        "
      >
        ⏳ Pending
      </button>


      <button
        onclick="updatePaymentStatus('${order.id}','PAID')"
        style="
          background:#1565c0;
          color:white;
          border:0;
          padding:10px 15px;
          border-radius:6px;
          cursor:pointer;
        "
      >
        💰 Mark Paid
      </button>

    </div>


    <br>


    <button
      onclick="
        document
          .getElementById('orderDetailsBox')
          .remove()
      "
      style="
        background:#555;
        color:white;
        border:0;
        padding:10px 18px;
        border-radius:6px;
        cursor:pointer;
      "
    >
      Close
    </button>

  `;


  document.body.appendChild(detailsBox);

}


/* UPDATE ORDER STATUS */

async function updateOrderStatus(orderId, newStatus){

  const { error } =
    await supabaseClient
      .from("orders")
      .update({
        status: newStatus,
        order_status: newStatus
      })
      .eq("id", orderId);


  if(error){

    console.error(error);

    alert(
      "Order status update nahi hua.\n\n" +
      error.message
    );

    return;
  }


  alert(
    "Order status successfully updated to " +
    newStatus
  );


  const box =
    document.getElementById("orderDetailsBox");

  if(box){
    box.remove();
  }


  loadOrders();

}


/* UPDATE PAYMENT STATUS */

async function updatePaymentStatus(orderId, newStatus){

  const { error } =
    await supabaseClient
      .from("orders")
      .update({
        payment_status: newStatus
      })
      .eq("id", orderId);


  if(error){

    console.error(error);

    alert(
      "Payment status update nahi hua.\n\n" +
      error.message
    );

    return;
  }


  alert(
    "Payment status successfully updated to " +
    newStatus
  );


  const box =
    document.getElementById("orderDetailsBox");

  if(box){
    box.remove();
  }


  loadOrders();

}


/* VIEW PRESCRIPTION */

async function viewPrescription(prescriptionId){

  const { data: prescription, error } =
    await supabaseClient
      .from("prescriptions")
      .select("private_file_key")
      .eq("id", prescriptionId)
      .maybeSingle();


  if(error){

    console.error(error);

    alert(
      "Prescription load nahi ho paayi.\n\n" +
      error.message
    );

    return;
  }


  if(!prescription || !prescription.private_file_key){

    alert("Prescription file nahi mili.");

    return;
  }


  const { data: signedData, error: signedError } =
    await supabaseClient
      .storage
      .from("prescriptions")
      .createSignedUrl(
        prescription.private_file_key,
        300
      );


  if(signedError){

    console.error(signedError);

    alert(
      "Prescription open nahi ho paayi.\n\n" +
      signedError.message
    );

    return;
  }


  window.open(
    signedData.signedUrl,
    "_blank"
  );

    }

loadOrders();

checkAdmin();
</script>

</body>
</html>
