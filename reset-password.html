<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Admin Password - Cheque Pool Health Care</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f0fdf4;
}

.card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.10);
}

h2 {
    text-align: center;
    color: #15803d;
    margin-top: 0;
}

p {
    text-align: center;
    color: #555;
    line-height: 1.5;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 8px;
    background: #15803d;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#message {
    margin-top: 18px;
    padding: 10px;
    border-radius: 8px;
    overflow-wrap: anywhere;
    text-align: center;
}

a {
    color: #15803d;
}
</style>
</head>

<body>

<div class="card">

    <h2>🔐 Reset Admin Password</h2>

    <p>CHEQUE POOL HEALTH CARE</p>

    <p>अपना नया पासवर्ड नीचे डालें।</p>

    <form id="resetForm">

        <label for="password">New Password</label>
        <input
            type="password"
            id="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Enter new password"
            required
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
            type="password"
            id="confirmPassword"
            minlength="8"
            autocomplete="new-password"
            placeholder="Enter password again"
            required
        >

        <button type="submit" id="resetButton">
            Update Password
        </button>

    </form>

    <div id="message" role="status"></div>

</div>

<script>
const SUPABASE_URL = "https://ymhaxeferrpyhuavzcgu.supabase.co";

/*
  Supabase project URL is configured above.
  Replace the placeholder below with the project's
  existing public anon/publishable key.
  Never use a service_role or secret key here.
*/
const SUPABASE_ANON_KEY = "sb_publishable_oW6iGlVz8JhV6tpwm_SrKQ_sDlHBedX";

const message = document.getElementById("message");
const form = document.getElementById("resetForm");
const button = document.getElementById("resetButton");

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

function showMessage(text, success = false) {
    message.textContent = text;
    message.style.background = success ? "#dcfce7" : "#fee2e2";
    message.style.color = success ? "#166534" : "#991b1b";
}

async function checkRecoverySession() {
    const hash = window.location.hash;

    if (
        hash.includes("error=") ||
        hash.includes("error_description=")
    ) {
        showMessage(
            "Reset link expired or invalid. Please request a new password reset email."
        );
        return;
    }

    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {
        showMessage(
            "Valid reset session nahi mili. Email mein password reset link dobara open karein."
        );
        return;
    }

    showMessage("Reset link valid hai. Ab naya password set karein.", true);
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        showMessage("Password kam se kam 8 characters ka hona chahiye.");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("Dono passwords match nahi kar rahe.");
        return;
    }

    button.disabled = true;
    button.textContent = "Updating...";

    try {
        const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
            throw new Error(
                "Reset session nahi mili. Naya reset email mangayein aur link dobara kholein."
            );
        }

        const { error } = await supabaseClient.auth.updateUser({
            password: password
        });

        if (error) {
            throw error;
        }

        showMessage(
            "Password successfully update ho gaya! Ab Admin Login par jaakar naye password se login karein.",
            true
        );

        form.reset();

    } catch (error) {
        showMessage(error.message || "Password update nahi ho paya.");
    } finally {
        button.disabled = false;
        button.textContent = "Update Password";
    }
});

checkRecoverySession();
</script>

</body>
</html>
