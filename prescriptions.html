<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prescriptions - Cheque Pool Health Care</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  color:#222;
}

.header{
  background:#2563eb;
  color:white;
  padding:18px;
}

.header h2{
  margin:0;
}

.back{
  display:inline-block;
  margin-top:8px;
  color:white;
  text-decoration:none;
}

.container{
  padding:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#f1f5f9;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.delete{
  background:#dc2626;
  color:white;
}

.empty{
  text-align:center;
  padding:30px;
  color:#666;
}
</style>

</head>

<body>

<div class="header">

  <h2>📄 CHEQUE POOL HEALTH CARE</h2>

  <a class="back" href="admin.html">
    ← Back to Admin
  </a>

</div>

<div class="container">

  <div class="card">

    <h2>📄 Prescriptions</h2>

    <p>Manage customer prescriptions.</p>

    <div id="prescriptionCount">
      Loading...
    </div>

    <div id="prescriptionList">
      Loading prescriptions...
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://ymhaxeferrpyhuavzcgu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oW6iGlVz8JhV6tpwm_SrKQ_sDlHBedX";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadPrescriptions(){

  const { data, error } =
    await supabaseClient
      .from("prescriptions")
      .select("*")
      .order("id", { ascending:false });

  if(error){

    console.error(error);

    document.getElementById("prescriptionList").innerHTML =
      "<p>Prescriptions load nahi ho paayi.</p>" +
      "<p>" + error.message + "</p>";

    return;
  }

  const prescriptions = data || [];

  document.getElementById("prescriptionCount").innerHTML =
    "<b>Total Prescriptions: " +
    prescriptions.length +
    "</b>";

  if(prescriptions.length === 0){

    document.getElementById("prescriptionList").innerHTML =
      '<div class="empty">No prescriptions found.</div>';

    return;
  }

  let html = `
    <table>

      <tr>
        <th>ID</th>
        <th>User ID</th>
        <th>File</th>
        <th>Status</th>
        <th>Reviewed By</th>
        <th>Reviewed At</th>
        <th>Created At</th>
        <th>Action</th>
      </tr>
  `;

  prescriptions.forEach(p => {

    html += `
      <tr>

        <td>${p.id || "-"}</td>

        <td>${p.user_id || "-"}</td>

        <td>${p.private_file_key || "-"}</td>

        <td>${p.status || "Pending"}</td>

        <td>${p.reviewed_by || "-"}</td>

        <td>${p.reviewed_at || "-"}</td>

        <td>${p.created_at || "-"}</td>

        <td>
          <button
            class="delete"
            onclick="deletePrescription('${p.id}')">
            Delete
          </button>
        </td>

      </tr>
    `;

  });

  html += "</table>";

  document.getElementById("prescriptionList").innerHTML =
    html;
}


async function deletePrescription(id){

  const confirmDelete =
    confirm("Delete this prescription?");

  if(!confirmDelete){
    return;
  }

  const { error } =
    await supabaseClient
      .from("prescriptions")
      .delete()
      .eq("id", id);

  if(error){

    alert(
      "Delete failed:\n\n" +
      error.message
    );

    return;
  }

  alert("Prescription deleted successfully.");

  loadPrescriptions();
}


loadPrescriptions();

</script>

</body>
</html>
